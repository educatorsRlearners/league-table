name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only pull requests skip the code checks. The workflow itself must
  # still trigger on every pull request (a workflow-level paths filter would
  # leave the required checks stuck at "Expected"); a job skipped through
  # `needs` and `if` reports as Skipped, which satisfies a required check.
  # Fails safe: anything unclear means code=true and everything runs.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether code changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE_SHA" ] \
            && files="$(git diff --name-only --no-renames "$BASE_SHA" HEAD)" \
            && [ -n "$files" ]; then
            code=false
            while IFS= read -r f; do
              case "$f" in
                *.md | _docs/images/*) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "Changed files:"
          echo "${files:-<unknown>}"
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    name: check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v7.0.1

      - name: Set up uv with Python 3.13
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      - name: Frontend tests
        run: make test-frontend

      - name: Compose port guard
        run: make check-ports
