openapi: 3.1.0
info:
  title: League Table Backend (as expected by frontend/services/api.js)
  version: 1.0.0
  description: |
    Backend contract derived exclusively from the frontend API client
    (`frontend/services/api.js`, `mockSource.js`, `scoring.js`, `risk.js`,
    `tests.js`, and callers in `frontend/League Table.dc.html`).

    Note on `.claude/settings.json`: it only enables editor plugins
    (`typescript-lsp`, `code-simplifier`) — there are no extra data-source
    tools to consult, so this spec is grounded in the files above.

    Conventions used by the frontend:
    - `createApi({ source, store })` fans out reads to a DataSource
      (students/criteria/weeks/entries) and an AppStore (settings,
      commitments, risk, notes). The HTTP surface below is what a FastAPI
      service must expose to replace it.
    - Every method sends a `caller` object (`{ role: 'instructor' }` or
      `{ role: 'student', studentId, classId }`). Over HTTP this maps to the
      Bearer JWT identity; role/ownership rules are documented per endpoint.
    - Scores: raw 0-100 weighted sum (missing criteria excluded + rescaled),
      factor `min(1 + rate*H, cap)`, adjusted `min(100, raw*factor)`.
      Multi-week windows average weekly adjusted scores.
    - Ranks are competition ranks (1,1,3), ordered by adjusted, then raw,
      then configured tie-breakers.
servers:
  - url: http://localhost:8000
security:
  - bearerAuth: []
tags:
  - name: classes
  - name: ranking
  - name: students
  - name: commitments
  - name: risk
  - name: settings
  - name: cache
paths:
  /classes:
    get:
      tags: [classes]
      summary: List the instructor's classes
      description: |
        Frontend: `listClasses(instructorId = 'i1')`.
        Auth: instructor Bearer JWT. The `instructor_id` query defaults to the
        caller's own id server-side; passing another instructor's id is forbidden.
      parameters:
        - $ref: '#/components/parameters/InstructorIdQuery'
      responses:
        '200':
          description: Classes taught by the instructor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Class'
        '401': 
          $ref: '#/components/responses/Unauthorized'
        '403': 
          $ref: '#/components/responses/Forbidden'

  /classes/{classId}/bootstrap:
    get:
      tags: [classes]
      summary: Bootstrap the table view (weeks + criteria + settings)
      description: |
        Frontend: `getBootstrap(classId = 'c1')`. Aggregates what api.js
        header describes as `GET /classes/{id}/weeks + /criteria + /settings`
        plus accounts, source label, latest-complete-week, and data-check issues.
        Auth: any authenticated user (student must belong to the class).
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '200':
          description: Bootstrap payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bootstrap'
        '401': 
          $ref: '#/components/responses/Unauthorized'
        '403': 
          $ref: '#/components/responses/Forbidden'
        '404': 
          $ref: '#/components/responses/NotFound'

  /classes/{classId}/ranking:
    get:
      tags: [ranking]
      summary: Fully ranked table for a week/window
      description: |
        Frontend: `getRanking({ classId, weekId, windowMode, rollingN,
        criteriaKeys, weights, nameMode, caller })`.
        Auth: instructor sees full rows (raw/factor/hours); a student caller
        receives scoped rows (adjusted score + rank only, except own row).
        Student requesting a class that is not theirs -> 403.
        Unknown/empty week -> 200 with `rows: []`.
      parameters:
        - $ref: '#/components/parameters/ClassId'
        - name: week
          in: query
          required: true
          description: Week id (e.g. `w5`). Matches `weekId` param.
          schema: { type: string, example: w5 }
        - name: criteria
          in: query
          required: false
          description: Criterion keys. Repeat (`?criteria=a&criteria=b`) or comma-separated. Defaults to all.
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: window
          in: query
          required: false
          schema: { type: string, enum: [week, rolling, cumulative], default: week }
        - name: rollingN
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 16, default: 4 }
        - name: weights
          in: query
          required: false
          description: Weight override map (serialised JSON object). Rescaled to total 100 server-side.
          schema: { type: object, additionalProperties: { type: number } }
        - name: nameMode
          in: query
          required: false
          schema: { type: string, enum: [full, initials, nickname], default: full }
      responses:
        '200':
          description: Ranked rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingResponse'
        '401': 
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Student asked for another class
          content:
            application/json:
              schema: 
          $ref: '#/components/schemas/Error'

  /classes/{classId}/students/{studentId}/explanation:
    get:
      tags: [students]
      summary: Score breakdown for one student in a window
      description: |
        Frontend: `getExplanation({ classId, studentId, weekId, windowMode,
        rollingN, criteriaKeys, weights, nameMode, caller })`.
        Auth: instructor any student; student only own `studentId` -> else 403.
        `parts` always describe the focus (latest) week; `weeks` carries the
        per-week raw/hours/factor/adjusted series. 404 when the student has no
        entries in the window.
      parameters:
        - $ref: '#/components/parameters/ClassId'
        - $ref: '#/components/parameters/StudentId'
        - name: week
          in: query
          required: true
          schema: { type: string }
        - name: criteria
          in: query
          required: false
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: window
          in: query
          required: false
          schema: { type: string, enum: [week, rolling, cumulative], default: week }
        - name: rollingN
          in: query
          required: false
          schema: { type: integer, default: 4 }
        - name: weights
          in: query
          required: false
          schema: { type: object, additionalProperties: { type: number } }
        - name: nameMode
          in: query
          required: false
          schema: { type: string, enum: [full, initials, nickname], default: full }
      responses:
        '200':
          description: Explanation payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
        '401': 
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Student asked for another student's breakdown
          content:
            application/json:
              schema: 
          $ref: '#/components/schemas/Error'
        '404':
          description: No entries for that student in this window
          content:
            application/json:
              schema: 
          $ref: '#/components/schemas/Error'

  /classes/{classId}/explainer:
    get:
      tags: [classes]
      summary: Formula and current values, no personal data
      description: |
        Frontend: `getExplainer(classId)`. Returns typeWeights/rate/cap, a
        factor table for hours [0,10,20,25], and the worked example
        (raw 80, 12 work + 6 childcare -> 94.4). Must never mention students.
        Auth: any authenticated user.
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '200':
          description: Explainer payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explainer'
        '401': 
          $ref: '#/components/responses/Unauthorized'

  /me/commitments:
    get:
      tags: [commitments]
      summary: Own hours, status and factor by week
      description: |
        Frontend: `getCommitments({ classId, studentId, caller })`.
        Auth: instructor any student; student only own `studentId` -> else 403.
      parameters:
        - name: classId
          in: query
          required: true
          schema: { type: string }
        - name: studentId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Commitments payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commitments'
        '401': 
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Student read another student's hours
          content:
            application/json:
              schema: 
          $ref: '#/components/schemas/Error'

  /instructor/digest:
    get:
      tags: [risk]
      summary: Cross-class risk digest
      description: |
        Frontend: `getDigest(instructorId = 'i1')`.
        Auth: instructor-only. Covers every class taught. Each class group
        carries evaluation week, `comparedWith` (stored snapshot or prior
        week), and only rows with status new|still|cleared (never `quiet`),
        sorted by level severity. First visit `comparedWithStored=false`.
      parameters:
        - name: instructorId
          in: query
          required: false
          schema: { type: string, default: i1 }
      responses:
        '200':
          description: Digest payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Digest'
        '401': 
          $ref: '#/components/responses/Unauthorized'
        '403': 
          $ref: '#/components/responses/Forbidden'

  /classes/{classId}/students/{studentId}/risk:
    get:
      tags: [risk]
      summary: Risk record (instructor) / own standing source (student)
      description: |
        Frontend: `getRiskRecord({ classId, studentId, caller })`.
        Auth: instructor gets everything incl. `notes`; student only own record
        and receives `notes: []`. Other student's record -> 403. Unknown
        student -> 404. Includes 5 signals (on or off) with summaries+evidence,
        metrics, thresholds in force, and per-week level history.
      parameters:
        - $ref: '#/components/parameters/ClassId'
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Risk record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskRecord'
        '401': 
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Student opened another student's standing
          content:
            application/json:
              schema: 
          $ref: '#/components/schemas/Error'
        '404':
          description: No such student in this class
          content:
            application/json:
              schema: 
          $ref: '#/components/schemas/Error'

  /classes/{classId}/students/{studentId}/notes:
    post:
      tags: [risk]
      summary: Log outreach (instructor-private note)
      description: |
        Frontend: `addNote({ classId, studentId, body, caller })`.
        Auth: instructor-only -> student 403. Empty body -> 400. Body is
        trimmed server-side. Notes never travel to a student.
      parameters:
        - $ref: '#/components/parameters/ClassId'
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, example: 'Called home 22 Sep' }
      responses:
        '201':
          description: Created note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          description: Empty note body
          content:
            application/json:
              schema: 
          $ref: '#/components/schemas/Error'
        '401': 
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only an instructor can log outreach
          content:
            application/json:
              schema: 
          $ref: '#/components/schemas/Error'

  /classes/{classId}/risk-settings:
    get:
      tags: [risk]
      summary: Get per-class risk thresholds
      description: |
        Frontend: `getRiskSettings(classId)`. Per-class; never crosses over.
        Auth: instructor.
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '200':
          description: Risk settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskSettings'
        '401': 
          $ref: '#/components/responses/Unauthorized'
        '403': 
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [risk]
      summary: Save per-class risk thresholds
      description: |
        Frontend: `saveRiskSettings(classId, patch)`. Partial `{ thresholds,
        active }` merged server-side. Recomputes going forward; stored
        snapshots keep levels in effect at the time (history not rewritten).
        Auth: instructor.
      parameters:
        - $ref: '#/components/parameters/ClassId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskSettingsPatch'
      responses:
        '200':
          description: Saved risk settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskSettings'
        '401': 
          $ref: '#/components/responses/Unauthorized'
        '403': 
          $ref: '#/components/responses/Forbidden'

  /me/standing:
    get:
      tags: [students]
      summary: Student's own level and signals, nothing else
      description: |
        Frontend: `getMyStanding({ classId, studentId, caller })`.
        Auth: student own only -> else 403. Lists only signals that are on,
        plus `help` pointer. Contains no `notes`, no rank/classmate
        comparison, no other student data.
      parameters:
        - name: classId
          in: query
          required: true
          schema: { type: string }
        - name: studentId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Own standing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Standing'
        '401': 
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Student asked for another student's standing
          content:
            application/json:
              schema: 
          $ref: '#/components/schemas/Error'

  /classes/{classId}/settings:
    put:
      tags: [settings]
      summary: Save weights and adjustment parameters
      description: |
        Frontend: `saveSettings(classId, patch)`. `{ weights, typeWeights,
        rate, cap, tieBreakers? }`; weights normalised to total 100
        server-side and become the new default. Per-class. Auth: instructor.
      parameters:
        - $ref: '#/components/parameters/ClassId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeagueSettingsPatch'
      responses:
        '200':
          description: Saved league settings (incl. normalised weights)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueSettings'
        '401': 
          $ref: '#/components/responses/Unauthorized'
        '403': 
          $ref: '#/components/responses/Forbidden'

  /classes/{classId}/refresh:
    post:
      tags: [cache]
      summary: Force a fresh read (rate-limited)
      description: |
        Frontend: `refresh(classId)`. Local cooldown 10s -> 429 with
        `Retry-After`-style message. On source failure serves last good
        snapshot with `stale: true` (or 503 when nothing cached).
        Auth: authenticated (instructor in the UI).
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '200':
          description: Refresh result
          content:
            application/json:
              schema:
                type: object
                required: [lastUpdated, issues, stale]
                properties:
                  lastUpdated: { type: integer, description: Epoch ms }
                  issues: { type: array, items: { $ref: '#/components/schemas/Issue' } }
                  stale: { type: boolean }
        '401': 
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Refresh rate limit (one per 10s)
          content:
            application/json:
              schema: 
          $ref: '#/components/schemas/Error'
        '503':
          description: Source unreachable and nothing cached
          content:
            application/json:
              schema: 
          $ref: '#/components/schemas/Error'

  /classes/{classId}/status:
    get:
      tags: [cache]
      summary: Cache status ("last updated")
      description: |
        Frontend: `getStatus(classId)` (+ `describeSource()`).
        Returns lastUpdated epoch ms (null when never loaded), stale flag,
        data-check issues, and source label. Auth: authenticated.
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '200':
          description: Status payload
          content:
            application/json:
              schema:
                type: object
                required: [lastUpdated, stale, issues, source]
                properties:
                  lastUpdated: { type: integer, nullable: true }
                  stale: { type: boolean }
                  issues: { type: array, items: { $ref: '#/components/schemas/Issue' } }
                  source: { $ref: '#/components/schemas/SourceInfo' }
        '401': 
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT identifying the caller. Server derives role (instructor/student),
        studentId, and class membership; this replaces the frontend `caller`
        object. Ownership rules (own row/breakdown/commitments/standing only)
        are enforced with 403.

  parameters:
    ClassId:
      name: classId
      in: path
      required: true
      schema: { type: string, example: c1 }
    StudentId:
      name: studentId
      in: path
      required: true
      schema: { type: string, example: s01 }
    InstructorIdQuery:
      name: instructor_id
      in: query
      required: false
      schema: { type: string, default: i1 }

  responses:
    Unauthorized:
      description: Missing/invalid Bearer token
      content:
        application/json:
          schema: 
          $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not allowed (role/class ownership)
      content:
        application/json:
          schema: 
          $ref: '#/components/schemas/Error'
    NotFound:
      description: Unknown class/week/student
      content:
        application/json:
          schema: 
          $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        status: { type: integer }

    Class:
      type: object
      required: [id, instructor_id, name, term_id]
      properties:
        id: { type: string, example: c1 }
        instructor_id: { type: string, example: i1 }
        external_id: { type: string, example: 'univ:PHYS-204-A' }
        name: { type: string, example: 'PHYS 204 · Mechanics' }
        term_id: { type: string, example: t1 }
        sheet_id: { type: string, example: sheet-phys204 }

    Week:
      type: object
      required: [id, term_id, week_number, start_date, end_date]
      properties:
        id: { type: string, example: w5 }
        term_id: { type: string, example: t1 }
        week_number: { type: integer, example: 5 }
        start_date: { type: string, format: date, example: '2026-08-03' }
        end_date: { type: string, format: date, example: '2026-08-07' }

    Criterion:
      type: object
      required: [id, class_id, key, label, default_weight, sort_order]
      properties:
        id: { type: string, example: c1-homework }
        class_id: { type: string, example: c1 }
        key: { type: string, example: homework }
        label: { type: string, example: Homework }
        unit: { type: string, example: 'tasks on time' }
        default_weight: { type: number, example: 25 }
        sort_order: { type: integer }

    Account:
      type: object
      required: [id, role, class_ids]
      properties:
        id: { type: string }
        role: { type: string, enum: [instructor, student] }
        student_id: { type: string, nullable: true }
        class_ids: { type: array, items: { type: string } }
        external_id: { type: string }

    Hours:
      type: object
      required: [work, childcare, eldercare]
      properties:
        work: { type: number }
        childcare: { type: number }
        eldercare: { type: number }

    TypeWeights:
      type: object
      required: [work, childcare, eldercare]
      properties:
        work: { type: number, example: 1 }
        childcare: { type: number, example: 1 }
        eldercare: { type: number, example: 1 }

    LeagueSettings:
      type: object
      required: [typeWeights, rate, cap]
      properties:
        weights: { type: object, additionalProperties: { type: number }, nullable: true }
        typeWeights: { $ref: '#/components/schemas/TypeWeights' }
        rate: { type: number, example: 0.01 }
        cap: { type: number, example: 1.25 }
        tieBreakers: { type: array, items: { type: string }, example: [attendance, homework] }

    LeagueSettingsPatch:
      type: object
      properties:
        weights: { type: object, additionalProperties: { type: number } }
        typeWeights: { $ref: '#/components/schemas/TypeWeights' }
        rate: { type: number }
        cap: { type: number }
        tieBreakers: { type: array, items: { type: string } }

    SourceInfo:
      type: object
      required: [kind, label, demo, store]
      properties:
        kind: { type: string, example: toy }
        label: { type: string, example: 'Demo data' }
        demo: { type: boolean }
        store: { type: string, example: 'In memory' }

    Issue:
      type: object
      required: [level, where, message]
      properties:
        level: { type: string, enum: [error, warning] }
        where: { type: string, description: Entry id }
        message: { type: string }

    ScorePart:
      type: object
      required: [key, label, weight, effectiveWeight, points, missing]
      properties:
        key: { type: string }
        label: { type: string }
        earned: { type: number, nullable: true }
        possible: { type: number, nullable: true }
        normalised: { type: number, nullable: true }
        weight: { type: number }
        effectiveWeight: { type: number }
        points: { type: number }
        missing: { type: boolean }

    RankingRow:
      type: object
      required: [student_id, display_name, score, rank, tied, rank_delta, gap_to_next, gap_to_below, missing, is_self]
      properties:
        student_id: { type: string }
        display_name: { type: string }
        score: { type: number, description: Adjusted score (window mean), 0-100 }
        rank: { type: integer }
        tied: { type: boolean }
        rank_delta: { type: integer, nullable: true, description: Previous-week rank minus current rank; null on first appearance }
        gap_to_next: { type: number, nullable: true }
        gap_to_below: { type: number, nullable: true }
        missing: { type: array, items: { type: string } }
        is_self: { type: boolean }
        raw: { type: number, description: Instructor or own row only }
        factor: { type: number, description: Instructor or own row only }
        weighted_hours: { type: number, description: Instructor or own row only }
        capped: { type: boolean, description: Instructor or own row only }
        hours_source: { type: string, nullable: true, description: Instructor or own row only }

    RankingResponse:
      type: object
      required: [classId, weekId, windowMode, rollingN, criteriaKeys, weights, rows, weekCount, lastUpdated, stale, issues]
      properties:
        classId: { type: string }
        weekId: { type: string }
        windowMode: { type: string, enum: [week, rolling, cumulative] }
        rollingN: { type: integer }
        criteriaKeys: { type: array, items: { type: string } }
        weights: { type: object, additionalProperties: { type: number } }
        rows: { type: array, items: { $ref: '#/components/schemas/RankingRow' } }
        weekCount: { type: integer, description: Weeks covered by the window }
        lastUpdated: { type: integer }
        stale: { type: boolean }
        issues: { type: array, items: { $ref: '#/components/schemas/Issue' } }

    WeekScore:
      type: object
      required: [week_number, raw, weighted_hours, factor, adjusted, capped]
      properties:
        week_number: { type: integer }
        raw: { type: number }
        weighted_hours: { type: number }
        factor: { type: number }
        adjusted: { type: number }
        capped: { type: boolean }

    Explanation:
      type: object
      required: [student_id, display_name, rank, tied, score, raw, focusRaw, focusAdjusted, focusCapped, factor, weighted_hours, capped, hours, typeWeights, rate, cap, focusWeek, parts, weeks, weekId, windowMode]
      properties:
        student_id: { type: string }
        display_name: { type: string }
        rank: { type: integer }
        tied: { type: boolean }
        score: { type: number }
        raw: { type: number }
        focusRaw: { type: number }
        focusAdjusted: { type: number }
        focusCapped: { type: boolean }
        factor: { type: number }
        weighted_hours: { type: number }
        capped: { type: boolean }
        hours: { $ref: '#/components/schemas/Hours' }
        hours_source: { type: string, nullable: true }
        typeWeights: { $ref: '#/components/schemas/TypeWeights' }
        rate: { type: number }
        cap: { type: number }
        focusWeek: { type: integer }
        parts: { type: array, items: { $ref: '#/components/schemas/ScorePart' } }
        weeks: { type: array, items: { $ref: '#/components/schemas/WeekScore' } }
        gap_to_next: { type: number, nullable: true }
        gap_to_below: { type: number, nullable: true }
        above: { type: string, nullable: true }
        weekId: { type: string }
        windowMode: { type: string }

    Explainer:
      type: object
      required: [typeWeights, rate, cap, table, example]
      properties:
        typeWeights: { $ref: '#/components/schemas/TypeWeights' }
        rate: { type: number }
        cap: { type: number }
        table: { type: array, items: { type: object, required: [hours, factor], properties: { hours: { type: number }, factor: { type: number } } } }
        example:
          type: object
          required: [raw, hours, weighted_hours, factor, adjusted]
          properties:
            raw: { type: number, example: 80 }
            hours: { $ref: '#/components/schemas/Hours' }
            weighted_hours: { type: number }
            factor: { type: number }
            adjusted: { type: number }

    Bootstrap:
      type: object
      required: [klass, classes, weeks, criteria, weights, defaultWeights, settings, tieBreakers, accounts, weeksWithData, latestCompleteWeekId, source, lastUpdated, issues, rollingN]
      properties:
        klass: { $ref: '#/components/schemas/Class' }
        classes: { type: array, items: { $ref: '#/components/schemas/Class' } }
        weeks: { type: array, items: { $ref: '#/components/schemas/Week' } }
        criteria: { type: array, items: { $ref: '#/components/schemas/Criterion' } }
        weights: { type: object, additionalProperties: { type: number } }
        defaultWeights: { type: object, additionalProperties: { type: number } }
        settings:
          type: object
          required: [typeWeights, rate, cap]
          properties:
            typeWeights: { $ref: '#/components/schemas/TypeWeights' }
            rate: { type: number }
            cap: { type: number }
        tieBreakers: { type: array, items: { type: string }, description: Resolved labels }
        accounts: { type: array, items: { $ref: '#/components/schemas/Account' } }
        weeksWithData: { type: array, items: { type: string } }
        latestCompleteWeekId: { type: string, nullable: true }
        source: { $ref: '#/components/schemas/SourceInfo' }
        lastUpdated: { type: integer }
        issues: { type: array, items: { $ref: '#/components/schemas/Issue' } }
        rollingN: { type: integer }

    Baseline:
      type: object
      properties:
        id: { type: string }
        student_id: { type: string }
        work_hours: { type: number }
        childcare_hours: { type: number }
        eldercare_hours: { type: number }
        status: { type: string, enum: [approved, pending, rejected, superseded] }
        effective_from_week: { type: integer, nullable: true }
        submitted_at: { type: string, format: date-time, nullable: true }
        decided_by: { type: string, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }

    WeeklyUpdate:
      type: object
      properties:
        id: { type: string }
        student_id: { type: string }
        week_id: { type: string }
        week_number: { type: integer }
        work_hours: { type: number }
        childcare_hours: { type: number }
        eldercare_hours: { type: number }
        entered_at: { type: string, format: date-time }
        reversed_by: { type: string, nullable: true }
        reversed_at: { type: string, format: date-time, nullable: true }

    Commitments:
      type: object
      required: [studentId, baseline, weeklyUpdates, byWeek]
      properties:
        studentId: { type: string }
        baseline: { $ref: '#/components/schemas/Baseline', nullable: true }
        weeklyUpdates: { type: array, items: { $ref: '#/components/schemas/WeeklyUpdate' } }
        byWeek:
          type: array
          items:
            type: object
            required: [week_number, hours, weighted_hours, factor]
            properties:
              week_number: { type: integer }
              hours: { $ref: '#/components/schemas/Hours' }
              source: { type: string, nullable: true }
              weighted_hours: { type: number }
              factor: { type: number }

    Signal:
      type: object
      required: [key, label, active, on, summary, evidence]
      properties:
        key: { type: string, enum: [downward_trend, missed_engagement, low_projected_grade, heavy_commitments, missing_data] }
        label: { type: string }
        active: { type: boolean }
        on: { type: boolean }
        summary: { type: string }
        evidence: { type: array, items: { type: object, required: [label, value], properties: { label: { type: string }, value: { type: string } } } }

    RiskMetrics:
      type: object
      properties:
        declineRun: { type: integer }
        missedAssignments: { type: integer }
        attendancePct: { type: number, nullable: true }
        participationPct: { type: number, nullable: true }
        projected: { type: number, nullable: true }
        hours: { type: number, nullable: true }
        missingRun: { type: integer }

    RiskThresholds:
      type: object
      required: [declineWeeks, missedAssignments, attendancePct, participationPct, projectedGrade, commitmentHours, missingWeeks]
      properties:
        declineWeeks: { type: integer, example: 3 }
        missedAssignments: { type: integer, example: 2 }
        attendancePct: { type: number, example: 70 }
        participationPct: { type: number, example: 50 }
        projectedGrade: { type: number, example: 60 }
        commitmentHours: { type: number, example: 20 }
        missingWeeks: { type: integer, example: 2 }

    RiskSettings:
      type: object
      required: [thresholds, active]
      properties:
        thresholds: { $ref: '#/components/schemas/RiskThresholds' }
        active:
          type: object
          required: [downward_trend, missed_engagement, low_projected_grade, heavy_commitments, missing_data]
          properties:
            downward_trend: { type: boolean }
            missed_engagement: { type: boolean }
            low_projected_grade: { type: boolean }
            heavy_commitments: { type: boolean }
            missing_data: { type: boolean }

    RiskSettingsPatch:
      type: object
      properties:
        thresholds:
          type: object
          properties:
            declineWeeks: { type: integer }
            missedAssignments: { type: integer }
            attendancePct: { type: number }
            participationPct: { type: number }
            projectedGrade: { type: number }
            commitmentHours: { type: number }
            missingWeeks: { type: integer }
        active:
          type: object
          properties:
            downward_trend: { type: boolean }
            missed_engagement: { type: boolean }
            low_projected_grade: { type: boolean }
            heavy_commitments: { type: boolean }
            missing_data: { type: boolean }

    DigestRow:
      type: object
      required: [student_id, display_name, level, status, signals, notes]
      properties:
        student_id: { type: string }
        display_name: { type: string }
        level: { type: string, enum: ['Not flagged', Watch, 'At risk', 'High risk'] }
        status: { type: string, enum: [new, still, cleared] }
        priorLevel: { type: string, nullable: true }
        signals: { type: array, items: { type: string }, description: Labels of signals on }
        notes: { type: integer }

    Digest:
      type: object
      required: [instructorId, groups, computedAt]
      properties:
        instructorId: { type: string }
        groups:
          type: array
          items:
            type: object
            required: [classId, className, week, comparedWith, comparedWithStored, rows]
            properties:
              classId: { type: string }
              className: { type: string }
              week: { type: integer }
              comparedWith: { type: integer, nullable: true }
              comparedWithStored: { type: boolean }
              rows: { type: array, items: { $ref: '#/components/schemas/DigestRow' } }
        computedAt: { type: string, format: date-time }

    Note:
      type: object
      required: [id, instructor_id, class_id, student_id, body, created_at]
      properties:
        id: { type: string }
        instructor_id: { type: string }
        class_id: { type: string }
        student_id: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }

    RiskRecord:
      type: object
      required: [classId, className, student_id, display_name, week, level, signals, metrics, thresholds, history, notes]
      properties:
        classId: { type: string }
        className: { type: string }
        student_id: { type: string }
        display_name: { type: string }
        week: { type: integer }
        level: { type: string }
        oneAway: { type: string, nullable: true }
        signals: { type: array, items: { $ref: '#/components/schemas/Signal' } }
        metrics: { $ref: '#/components/schemas/RiskMetrics' }
        thresholds: { $ref: '#/components/schemas/RiskThresholds' }
        history:
          type: array
          items:
            type: object
            required: [week_number, level, count]
            properties:
              week_number: { type: integer }
              level: { type: string }
              count: { type: integer }
        notes:
          type: array
          description: Instructor-private; always [] for a student caller
          items: { $ref: '#/components/schemas/Note' }

    Standing:
      type: object
      required: [student_id, display_name, week, level, signals, metrics, help]
      properties:
        student_id: { type: string }
        display_name: { type: string }
        week: { type: integer }
        level: { type: string }
        signals: { type: array, items: { $ref: '#/components/schemas/Signal' }, description: Only signals with on=true }
        metrics: { $ref: '#/components/schemas/RiskMetrics' }
        help: { type: string }
