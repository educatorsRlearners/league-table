openapi: 3.1.0
info:
  title: League Table API
  version: 0.2.0
  license:
    name: MIT
    identifier: MIT
  description: |
    The backend the League Table frontend (`frontend/services/httpApi.js`) talks to.

    Scoring, the commitments adjustment, ranking and tie-breaking all run on the server;
    the browser only renders the result. A student's raw score is weighted by criterion,
    multiplied by a capped factor from the weekly hours they report and approved by the
    instructor, and clipped at 100. Classmates see only the final adjusted score and rank.

    **Conventions**
    - Every field, query parameter and path parameter is `snake_case`, matching the
      data model in `_docs/spec.md` and FastAPI's defaults. The frontend's services
      layer translates its own JS option names (`weekId`, `windowMode`, ...) at the
      HTTP boundary.
    - Timestamps (`last_updated`, `submitted_at`, ...) are ISO 8601 UTC strings, or
      `null` before any successful read.
    - Errors carry a human-readable `detail` message and an HTTP status; the client
      shows the message to the user.

    **Authentication**
    Every endpoint except `POST /auth/login` and `GET /demo/accounts` needs a session
    cookie. Roles are enforced by the server, never the browser. An `instructor` can do
    everything; a `student` may read the full ranking but only their own breakdown and
    commitments, and may not change settings or approve anything. Sign-in is by access
    code (students) or passcode (instructor) and sits behind an `IdentityProvider`, so
    university sign-in can replace it later.
servers:
  - url: /api
    description: Same origin as the frontend

tags:
  - name: Auth
    description: Sign-in and session.
  - name: Class
    description: Class metadata and the controls' data (weeks, criteria, weights).
  - name: Ranking
    description: The ranked table and per-student explanations.
  - name: Commitments
    description: Weekly hours a student reports, and the instructor's approvals, reversals and change log.
  - name: Data
    description: Cache status and refresh of the read-only data source.

security:
  - sessionCookie: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with an access code or the instructor passcode
      description: |
        A student's personal access code or the instructor's passcode, exchanged for a
        session. The service stores only a hash of each student's code. With demo data,
        the codes from `GET /demo/accounts` work here. A wrong code returns 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in. The session cookie is set on the response.
          headers:
            Set-Cookie:
              description: HttpOnly session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentAccount
      summary: The signed-in account
      description: Lets the frontend learn the caller's role and, for students, their `student_id`.
      responses:
        '200':
          description: The current account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the session
      responses:
        '204':
          description: Session ended and cookie cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /demo/accounts:
    get:
      tags: [Auth]
      operationId: listDemoAccounts
      summary: Demo accounts and their codes (demo data only)
      description: |
        Lists the seeded demo instructor and students so sign-in and role rules can be
        tried without real people, and includes their access codes for
        `POST /auth/login`. Exists only while the toy adapter is the active data
        source; any other source returns 404. It is never part of the class
        bootstrap.
      security: []
      responses:
        '200':
          description: Demo accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DemoAccount'
        '404':
          description: The active data source is not demo data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /classes/{class_id}:
    get:
      tags: [Class]
      operationId: getClass
      summary: Everything the page needs to start
      description: |
        The frontend's `getBootstrap`. Returns the class, its weeks and criteria, the
        saved weights (or each criterion's `default_weight` if none are saved), and
        the data-source status, in one call.
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '200':
          description: Class bootstrap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassBootstrap'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SourceUnavailable'

  /classes/{class_id}/weeks:
    get:
      tags: [Class]
      operationId: listWeeks
      summary: Weeks of the term, in order
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '200':
          description: Weeks, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Week'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SourceUnavailable'

  /classes/{class_id}/criteria:
    get:
      tags: [Class]
      operationId: listCriteria
      summary: Ranking criteria, in display order
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '200':
          description: Criteria ordered by `sort_order`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Criterion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SourceUnavailable'

  /classes/{class_id}/settings:
    get:
      tags: [Class]
      operationId: getSettings
      summary: Criterion weights and adjustment parameters (instructor only)
      description: Weights fall back to each criterion's `default_weight` when nothing has been saved.
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '200':
          description: The current settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
    put:
      tags: [Class]
      operationId: saveSettings
      summary: Save criterion weights and adjustment parameters (instructor only)
      description: |
        Every field is optional; what is left out keeps its value. Criterion weights are
        rescaled to total 100, preserving proportions, and criteria left out are stored as
        zero. Adjustment fields are merged into the current ones and range-checked. Rankings
        are computed on the fly, so a change re-ranks every week. Adjustment changes are
        written to the change log.
      parameters:
        - $ref: '#/components/parameters/ClassId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveSettingsRequest'
      responses:
        '200':
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/SourceUnavailable'

  /classes/{class_id}/explainer:
    get:
      tags: [Class]
      operationId: getExplainer
      summary: The scoring formula and its current parameters
      description: |
        The same for everyone: the formula, the current type weights, rate and cap, a
        factor table and worked examples. It holds no one's hours.
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '200':
          description: The explainer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explainer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /classes/{class_id}/ranking:
    get:
      tags: [Ranking]
      operationId: getRanking
      summary: The ranked table for a week or cumulative window
      description: |
        Scores every student with entries in the window and ranks them by adjusted score.
        Each week is scored on its own: criteria are weighted into a raw score, multiplied
        by that week's commitments factor and clipped at 100. A window of several weeks
        averages the weekly adjusted scores, and a week where a student has no entries is
        left out of their average. Students level on adjusted score are ordered by raw
        score, then by the tie-breaker criteria (attendance, then homework); any still level
        share a rank (1, 1, 3). A criterion a student has no data for is left out and the
        remaining weights are rescaled, so missing data is never scored as zero.

        Rows carry the adjusted score and rank only: never another student's raw score,
        factor or hours.

        `rank_delta` compares against the previous week's table with the same
        criteria, weights and window mode, and is `null` for the first week or when
        the student was not ranked then.

        Any signed-in role may call this. `weights` lets the instructor preview weights
        before saving them; when omitted, the saved weights are used.
      parameters:
        - $ref: '#/components/parameters/ClassId'
        - $ref: '#/components/parameters/Week'
        - $ref: '#/components/parameters/Window'
        - $ref: '#/components/parameters/RollingWeeks'
        - $ref: '#/components/parameters/Criteria'
        - $ref: '#/components/parameters/Weights'
        - $ref: '#/components/parameters/NameMode'
      responses:
        '200':
          description: The ranking, best first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ranking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/SourceUnavailable'

  /classes/{class_id}/students/{student_id}/explanation:
    get:
      tags: [Ranking]
      operationId: getExplanation
      summary: How one student's rank was reached, criterion by criterion
      description: |
        The instructor may open any student. A student may open only their own; asking
        for another student's breakdown returns 403 regardless of what the client
        sends. Accepts the same window, criteria, weights and name mode as the
        ranking so the breakdown always matches the table being viewed.

        Shows the criteria (which add up to the raw score), the weighted hours by type,
        the factor, the adjusted score, whether it was clipped at 100 and the gap to the
        next rank. For a window of several weeks, `weeks` lists each week and the scores
        are means.
      parameters:
        - $ref: '#/components/parameters/ClassId'
        - name: student_id
          in: path
          required: true
          schema:
            type: string
          example: s01
        - $ref: '#/components/parameters/Week'
        - $ref: '#/components/parameters/Window'
        - $ref: '#/components/parameters/RollingWeeks'
        - $ref: '#/components/parameters/Criteria'
        - $ref: '#/components/parameters/Weights'
        - $ref: '#/components/parameters/NameMode'
      responses:
        '200':
          description: The breakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown class or student, or the student has no entries in this window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/SourceUnavailable'

  /classes/{class_id}/status:
    get:
      tags: [Data]
      operationId: getStatus
      summary: Data freshness and validation issues
      description: |
        Read from the server's cache; never triggers a fetch from the data source.
        `last_updated` is `null` before the first successful read.
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '200':
          description: Current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /classes/{class_id}/refresh:
    post:
      tags: [Data]
      operationId: refresh
      summary: Re-read the data source now (instructor only)
      description: |
        Bypasses the server's cache (60 s TTL). Rate limited to one call per 10
        seconds; a call inside the cooldown returns 429 with a message such as
        "Please wait 7s before refreshing again." If the source fails but a previous
        snapshot exists, the call succeeds with `stale: true`.
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '200':
          description: Refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Refreshed too recently.
          headers:
            Retry-After:
              description: Seconds until the next refresh is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/SourceUnavailable'

  /me/commitments:
    get:
      tags: [Commitments]
      operationId: getMyCommitments
      summary: Your baseline, weekly updates and factor by week (student only)
      responses:
        '200':
          description: The signed-in student's own commitments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyCommitments'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/commitments/baseline:
    put:
      tags: [Commitments]
      operationId: saveMyBaseline
      summary: Submit a semester baseline for approval (student only)
      description: |
        One set of weekly hours for the whole semester. It starts as `pending` and has no
        effect until the instructor approves it. Submitting again while one is pending
        replaces it; submitting after an approval is a baseline change that also waits for
        approval, and the old baseline stays in force meanwhile. Hours go in half-hour steps,
        at most 80 per type and 120 in total.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoursRequest'
      responses:
        '200':
          description: The pending baseline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Baseline'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/commitments/weeks/{week_number}:
    put:
      tags: [Commitments]
      operationId: saveMyWeek
      summary: Set your hours for one week (student only)
      description: |
        Replaces the baseline hours for that week. Only the current and previous week can
        be edited, judged by the Weeks calendar and the server's clock; any other week is
        refused with 403. The update takes effect at once and is logged, but only counts
        once an approved baseline covers that week. A large difference from the baseline is
        flagged in the change log.
      parameters:
        - $ref: '#/components/parameters/WeekNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoursRequest'
      responses:
        '200':
          description: The weekly update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyUpdate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Commitments]
      operationId: resetMyWeek
      summary: Reset one week to your baseline (student only)
      description: Follows the same edit window. Resetting a week that already follows the baseline does nothing.
      parameters:
        - $ref: '#/components/parameters/WeekNumber'
      responses:
        '204':
          description: The week follows the baseline.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/commitments/preview:
    post:
      tags: [Commitments]
      operationId: previewMyAdjustment
      summary: Your factor and adjusted score for hours you have not saved (student only)
      description: |
        For the live preview as a student types. Shows what the hours would give once an
        approved baseline covers the week, using the current settings. Nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequest'
      responses:
        '200':
          description: The preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /classes/{class_id}/approvals:
    get:
      tags: [Commitments]
      operationId: listApprovals
      summary: Baselines waiting for a decision (instructor only)
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '200':
          description: Pending baselines and baseline changes, with hours by type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approvals'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SourceUnavailable'

  /classes/{class_id}/approvals/{approval_id}:
    post:
      tags: [Commitments]
      operationId: decideApproval
      summary: Approve a baseline from a week, or reject it (instructor only)
      description: |
        Approving makes the baseline count from `effective_week`, by default the current
        week, so earlier weeks keep the factor they had. A baseline it replaces stays in
        force before that week. Rejecting leaves the factor as it was.
      parameters:
        - $ref: '#/components/parameters/ClassId'
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
          example: b3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: The decided baseline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Baseline'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That baseline has already been decided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/SourceUnavailable'

  /classes/{class_id}/students/{student_id}/weeks/{week_number}/reverse:
    post:
      tags: [Commitments]
      operationId: reverseWeeklyUpdate
      summary: Reverse a student's weekly update (instructor only)
      description: |
        Restores the value before the update, whether an earlier update or the baseline,
        and logs the reversal. The student can enter that week again.
      parameters:
        - $ref: '#/components/parameters/ClassId'
        - name: student_id
          in: path
          required: true
          schema:
            type: string
          example: s01
        - $ref: '#/components/parameters/WeekNumber'
      responses:
        '204':
          description: Reversed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown class, student or week, or no weekly update to reverse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/SourceUnavailable'

  /classes/{class_id}/change-log:
    get:
      tags: [Commitments]
      operationId: getChangeLog
      summary: Every commitment change, newest first (instructor only)
      description: |
        Every submission, approval, rejection, weekly update, reset and reversal, and every
        change to the adjustment settings, with who, when, and the old and new values.
      parameters:
        - $ref: '#/components/parameters/ClassId'
        - name: student_id
          in: query
          description: Only this student's entries.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: Log entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/SourceUnavailable'

  /classes/{class_id}/commitments:
    get:
      tags: [Commitments]
      operationId: listStudentCommitments
      summary: Every student's baseline status, hours and factor (instructor only)
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '200':
          description: One row per student.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentCommitments'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SourceUnavailable'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: HttpOnly session cookie set by `/auth/login`.

  parameters:
    ClassId:
      name: class_id
      in: path
      required: true
      schema:
        type: string
      example: c1
    Week:
      name: week
      in: query
      required: true
      description: ID of the week to rank. With `window=cumulative`, this is the last week included.
      schema:
        type: string
      example: w5
    Window:
      name: window
      in: query
      description: |
        `week` scores only that week. `cumulative` averages the weekly adjusted scores from
        week 1 through `week`, and `rolling` averages the last `rolling_weeks` weeks ending
        at `week`.
      schema:
        type: string
        enum: [week, cumulative, rolling]
        default: week
    RollingWeeks:
      name: rolling_weeks
      in: query
      description: How many weeks a `rolling` window covers.
      schema:
        type: integer
        minimum: 2
        maximum: 16
        default: 4
    WeekNumber:
      name: week_number
      in: path
      required: true
      description: The week's number in the term (1 to 16), not its ID.
      schema:
        type: integer
      example: 5
    Criteria:
      name: criteria
      in: query
      description: Criterion keys to include, comma-separated. Omitted or empty means all criteria.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
      example: [homework, attendance]
    Weights:
      name: weights
      in: query
      description: |
        JSON-encoded object mapping criterion key to weight, for previewing unsaved
        weights. Criteria not listed get weight 0. The server rescales the weights
        of the selected criteria to total 100. Omitted means use the saved weights.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Weights'
          example: { homework: 40, attendance: 30, participation: 30 }
    NameMode:
      name: name_mode
      in: query
      description: |
        How names are shown in `display_name`. `nickname` falls back to the full
        name when a student has none; `initials` shows "First L.".
      schema:
        type: string
        enum: [full, nickname, initials]
        default: full

  responses:
    Unauthorized:
      description: No valid session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller's role does not allow this.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: A student may only open their own breakdown.
    NotFound:
      description: Unknown class.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: |
        A parameter or body field is missing or malformed. Uses FastAPI's default 422
        body, where `detail` is a list of per-field problems.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    SourceUnavailable:
      description: |
        The data source did not respond and there is no earlier snapshot to serve.
        When a snapshot exists the server serves it with `stale: true` instead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: The data source did not respond.

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Message safe to show to the user.

    ValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            required: [loc, msg, type]
            properties:
              loc:
                type: array
                description: Where the problem is, e.g. `["query", "week"]`.
                items:
                  type: [string, integer]
              msg:
                type: string
              type:
                type: string

    Role:
      type: string
      enum: [instructor, student]

    Account:
      type: object
      required: [id, role, student_id, external_id]
      properties:
        id:
          type: string
          example: a2
        role:
          $ref: '#/components/schemas/Role'
        student_id:
          type: [string, 'null']
          description: The student this account belongs to; `null` for the instructor.
          example: s01
        external_id:
          type: string
          description: ID from an outside identity system, so sign-in can be matched later.
          example: demo:amara

    DemoAccount:
      description: |
        A seeded demo account with its access code. These codes are public by design and
        must never be accepted by a deployment using real student data.
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          required: [name, code]
          properties:
            name:
              type: string
              example: Amara Okonkwo
            code:
              type: string
              example: demo-amara

    LoginRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          format: password
          minLength: 1
          description: A student's access code, or the instructor's passcode.

    Class:
      type: object
      required: [id, external_id, name, term_id]
      properties:
        id:
          type: string
          example: c1
        external_id:
          type: string
          example: demo:phys101-b
        name:
          type: string
          example: Introductory Physics · Group B
        term_id:
          type: string
          example: t1

    Week:
      type: object
      required: [id, term_id, week_number, start_date, end_date]
      properties:
        id:
          type: string
          example: w1
        term_id:
          type: string
          example: t1
        week_number:
          type: integer
          example: 1
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date

    Criterion:
      type: object
      required: [id, class_id, key, label, unit, default_weight, sort_order]
      properties:
        id:
          type: string
        class_id:
          type: string
        key:
          type: string
          description: Stable identifier used in `criteria`, `weights` and score parts.
          example: homework
        label:
          type: string
          example: Homework
        unit:
          type: string
          example: tasks on time
        default_weight:
          type: number
          minimum: 0
          example: 25
        sort_order:
          type: integer

    Weights:
      type: object
      description: Criterion key to weight. Values are non-negative.
      additionalProperties:
        type: number
        minimum: 0
      example: { homework: 25, attendance: 20, participation: 20, project: 25, quizzes: 10 }

    AdjustmentSettings:
      type: object
      description: |
        The parameters of the adjustment. Weighted hours are `H = sum(a_k × h_k)`, the factor is
        `min(1 + rate × H, cap)`, and the adjusted score is `min(100, raw × factor)`.
      required: [type_weights, rate, cap, flag_hours]
      properties:
        type_weights:
          $ref: '#/components/schemas/Weights'
        rate:
          type: number
          minimum: 0
          maximum: 1
          description: Factor added per weighted hour.
          example: 0.01
        cap:
          type: number
          minimum: 1
          maximum: 3
          description: The most the factor can reach.
          example: 1.25
        flag_hours:
          type: number
          minimum: 0
          description: A weekly entry differing from the baseline by more total hours than this is flagged.
          example: 10

    Settings:
      type: object
      required: [weights, adjustment]
      properties:
        weights:
          $ref: '#/components/schemas/Weights'
        adjustment:
          $ref: '#/components/schemas/AdjustmentSettings'

    AdjustmentPatch:
      type: object
      description: Only the fields given are changed. Type weights are merged into the current ones.
      properties:
        type_weights:
          oneOf:
            - $ref: '#/components/schemas/Weights'
            - type: 'null'
        rate:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        cap:
          type: [number, 'null']
          minimum: 1
          maximum: 3
        flag_hours:
          type: [number, 'null']
          minimum: 0

    SaveSettingsRequest:
      type: object
      description: Every field is optional, and `null` means the same as leaving it out.
      properties:
        weights:
          oneOf:
            - $ref: '#/components/schemas/Weights'
            - type: 'null'
        adjustment:
          oneOf:
            - $ref: '#/components/schemas/AdjustmentPatch'
            - type: 'null'

    SourceInfo:
      type: object
      required: [kind, label, demo]
      properties:
        kind:
          type: string
          description: Which data-source adapter is active (`toy` for seeded demo data).
          example: toy
        label:
          type: string
          example: Demo data
        demo:
          type: boolean
          description: True when the data is seeded demo data, so the UI can say so.

    Issue:
      type: object
      description: A problem found while validating the source data. The table is still served.
      required: [level, where, message]
      properties:
        level:
          type: string
          enum: [error, warning]
        where:
          type: string
          description: ID of the offending entry.
          example: e12
        message:
          type: string
          example: Unknown student ID "s99"

    ClassBootstrap:
      type: object
      required: [class, weeks, criteria, weights, tie_breakers, source, last_updated, issues]
      properties:
        class:
          $ref: '#/components/schemas/Class'
        weeks:
          type: array
          items:
            $ref: '#/components/schemas/Week'
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/Criterion'
        weights:
          $ref: '#/components/schemas/Weights'
        tie_breakers:
          type: array
          description: Labels of the criteria that order students still level after the raw score, in priority order.
          items:
            type: string
          example: [Attendance, Homework]
        source:
          $ref: '#/components/schemas/SourceInfo'
        last_updated:
          type: string
          format: date-time
          description: When the source was last read successfully (ISO 8601, UTC).
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'

    RankingRow:
      type: object
      required: [student_id, display_name, score, rank, tied, rank_delta, missing, gap_to_next, gap_to_below]
      properties:
        student_id:
          type: string
        display_name:
          type: string
          description: Name in the requested `name_mode`.
        score:
          type: number
          description: The adjusted score, 0 to 100. Nothing else about a classmate's score is sent.
        rank:
          type: integer
          minimum: 1
          description: Competition rank; students level on every tie-breaker share it.
        tied:
          type: boolean
          description: True for every student in a group that shares a rank, including the first.
        rank_delta:
          type: [integer, 'null']
          description: Places moved since the previous week (positive is up); `null` if there is no previous rank.
        missing:
          type: array
          description: Keys of weighted criteria the student has no data for in this window.
          items:
            type: string
        gap_to_next:
          type: [number, 'null']
          description: Points needed to reach the next rank up; `null` at the top.
        gap_to_below:
          type: [number, 'null']
          description: Lead over the next rank down; `null` at the bottom.

    Ranking:
      type: object
      required: [class_id, week_id, window_mode, rolling_weeks, criteria_keys, weights, rows, last_updated, stale, issues]
      properties:
        class_id:
          type: string
        week_id:
          type: string
        window_mode:
          type: string
          enum: [week, cumulative, rolling]
        rolling_weeks:
          type: [integer, 'null']
          description: The window length for `rolling`; `null` otherwise.
        criteria_keys:
          type: array
          description: The criteria actually used (all criteria when none were requested).
          items:
            type: string
        weights:
          $ref: '#/components/schemas/Weights'
        rows:
          type: array
          description: Best first. Only students with entries in the window appear.
          items:
            $ref: '#/components/schemas/RankingRow'
        last_updated:
          type: string
          format: date-time
          description: When the source was last read successfully (ISO 8601, UTC).
        stale:
          type: boolean
          description: True when the source failed and the last good snapshot was served instead.
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'

    ScorePart:
      type: object
      description: One criterion's contribution to a student's score.
      required: [key, label, earned, possible, normalised, weight, effective_weight, points, missing]
      properties:
        key:
          type: string
        label:
          type: string
        earned:
          type: [number, 'null']
          description: Sum of points earned in the window; `null` when missing.
        possible:
          type: [number, 'null']
          description: Sum of points available in the window; `null` when missing.
        normalised:
          type: [number, 'null']
          description: '`earned / possible` as 0 to 100; `null` when missing.'
        weight:
          type: number
          description: Weight as requested.
        effective_weight:
          type: number
          description: Weight after dropping missing criteria and rescaling to 100; 0 when missing.
        points:
          type: number
          description: '`normalised × effective_weight / 100`; 0 when missing. Parts sum to `raw_score`.'
        missing:
          type: boolean
          description: No data for this criterion in the window; it is excluded, not scored as zero.

    WeekBreakdown:
      type: object
      description: One week of a student's score, before and after the adjustment.
      required: [week_id, week_number, raw_score, weighted_hours, factor, adjusted_score, capped]
      properties:
        week_id:
          type: string
        week_number:
          type: integer
        raw_score:
          type: number
        weighted_hours:
          type: number
        factor:
          type: number
        adjusted_score:
          type: number
        capped:
          type: boolean
          description: The adjusted score was clipped at 100.

    Explanation:
      type: object
      description: |
        `score` is the adjusted score the table ranks on. For a window of several weeks each week
        is scored on its own and the weekly scores are averaged, so `raw_score` and `score` are
        means, `parts` average the weekly points, and `factor`, `weighted_hours` and `hours` are
        `null`; see `weeks`.
      required: [student_id, display_name, rank, tied, score, raw_score, factor, weighted_hours, hours, capped, parts, weeks, gap_to_next, gap_to_below, above, week_id, window_mode, rolling_weeks]
      properties:
        student_id:
          type: string
        display_name:
          type: string
        rank:
          type: integer
          minimum: 1
        tied:
          type: boolean
        score:
          type: number
          description: The adjusted score.
        raw_score:
          type: number
          description: The weighted criteria before the factor; the parts add up to it.
        factor:
          type: [number, 'null']
        weighted_hours:
          type: [number, 'null']
        hours:
          oneOf:
            - $ref: '#/components/schemas/Hours'
            - type: 'null'
          description: Weighted hours by commitment type, for a single week.
        capped:
          type: boolean
          description: Any week's adjusted score was clipped at 100.
        parts:
          type: array
          description: One per selected criterion, in criterion order.
          items:
            $ref: '#/components/schemas/ScorePart'
        weeks:
          type: array
          items:
            $ref: '#/components/schemas/WeekBreakdown'
        gap_to_next:
          type: [number, 'null']
        gap_to_below:
          type: [number, 'null']
        above:
          type: [string, 'null']
          description: Display name of the nearest student ranked above; `null` at the top.
        week_id:
          type: string
        window_mode:
          type: string
          enum: [week, cumulative, rolling]
        rolling_weeks:
          type: [integer, 'null']

    Status:
      type: object
      required: [last_updated, stale, issues, source]
      properties:
        last_updated:
          type: [string, 'null']
          format: date-time
          description: ISO 8601 UTC time of the last successful read, or `null` before the first.
        stale:
          type: boolean
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        source:
          $ref: '#/components/schemas/SourceInfo'

    RefreshResult:
      type: object
      required: [last_updated, issues, stale]
      properties:
        last_updated:
          type: string
          format: date-time
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        stale:
          type: boolean

    Hours:
      type: object
      description: Hours per week by commitment type key, such as `work`, `childcare` and `eldercare`.
      additionalProperties:
        type: number
      example: { work: 12, childcare: 6, eldercare: 0 }

    CommitmentType:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
          example: childcare
        label:
          type: string
          example: Child care

    HourLimits:
      type: object
      required: [step, per_type_max, total_max]
      properties:
        step:
          type: number
          example: 0.5
        per_type_max:
          type: number
          example: 80
        total_max:
          type: number
          example: 120

    HoursRequest:
      type: object
      required: [hours]
      properties:
        hours:
          $ref: '#/components/schemas/Hours'

    BaselineStatus:
      type: string
      enum: [pending, approved, rejected, superseded]

    Baseline:
      type: object
      required: [id, student_id, hours, status, effective_from_week, submitted_at, decided_at]
      properties:
        id:
          type: string
        student_id:
          type: string
        hours:
          $ref: '#/components/schemas/Hours'
        status:
          $ref: '#/components/schemas/BaselineStatus'
        effective_from_week:
          type: [integer, 'null']
          description: The week number it counts from; `null` until approved.
        submitted_at:
          type: string
          format: date-time
        decided_at:
          type: [string, 'null']
          format: date-time

    WeeklyUpdate:
      type: object
      required: [week_id, week_number, hours, entered_at, editable]
      properties:
        week_id:
          type: string
        week_number:
          type: integer
        hours:
          oneOf:
            - $ref: '#/components/schemas/Hours'
            - type: 'null'
          description: '`null` means the student reset this week to their baseline.'
        entered_at:
          type: string
          format: date-time
        editable:
          type: boolean
          description: The week is still inside the edit window.

    WeekFactor:
      type: object
      required: [week_id, week_number, source, hours, weighted_hours, factor]
      properties:
        week_id:
          type: string
        week_number:
          type: integer
        source:
          type: string
          enum: [none, baseline, weekly]
          description: Where that week's hours come from; `none` means no approved baseline covers it.
        hours:
          oneOf:
            - $ref: '#/components/schemas/Hours'
            - type: 'null'
        weighted_hours:
          type: number
        factor:
          type: number

    EditWindow:
      type: object
      required: [current_week_id, editable_week_ids]
      properties:
        current_week_id:
          type: [string, 'null']
          description: '`null` outside the term.'
        editable_week_ids:
          type: array
          items:
            type: string

    MyCommitments:
      type: object
      required: [types, limits, baseline, in_effect, weekly_updates, weeks, edit_window]
      properties:
        types:
          type: array
          items:
            $ref: '#/components/schemas/CommitmentType'
        limits:
          $ref: '#/components/schemas/HourLimits'
        baseline:
          oneOf:
            - $ref: '#/components/schemas/Baseline'
            - type: 'null'
          description: The latest submission, whatever its status.
        in_effect:
          oneOf:
            - $ref: '#/components/schemas/Baseline'
            - type: 'null'
          description: The approved baseline that counts now, if any.
        weekly_updates:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyUpdate'
        weeks:
          type: array
          items:
            $ref: '#/components/schemas/WeekFactor'
        edit_window:
          $ref: '#/components/schemas/EditWindow'

    PreviewRequest:
      type: object
      required: [hours]
      properties:
        hours:
          $ref: '#/components/schemas/Hours'
        week_id:
          type: [string, 'null']
          description: Defaults to the student's latest week with scores.

    Preview:
      type: object
      required: [week_id, raw_score, weighted_hours, factor, adjusted_score, capped]
      properties:
        week_id:
          type: string
        raw_score:
          type: number
        weighted_hours:
          type: number
        factor:
          type: number
        adjusted_score:
          type: number
        capped:
          type: boolean

    PendingApproval:
      type: object
      required: [id, student_id, display_name, hours, submitted_at, is_change, current, suggested_effective_week]
      properties:
        id:
          type: string
        student_id:
          type: string
        display_name:
          type: string
        hours:
          $ref: '#/components/schemas/Hours'
        submitted_at:
          type: string
          format: date-time
        is_change:
          type: boolean
          description: The student already has an approved baseline.
        current:
          oneOf:
            - $ref: '#/components/schemas/Hours'
            - type: 'null'
          description: The approved baseline's hours, for comparison.
        suggested_effective_week:
          type: [integer, 'null']

    Approvals:
      type: object
      required: [pending, current_week]
      properties:
        pending:
          type: array
          items:
            $ref: '#/components/schemas/PendingApproval'
        current_week:
          type: [integer, 'null']
          description: Number of the current week on the server's clock; `null` outside the term.

    DecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        effective_week:
          type: [integer, 'null']
          minimum: 1
          description: The week number the baseline counts from. Defaults to the current week.

    StudentCommitments:
      type: object
      required: [student_id, display_name, status, hours, effective_from_week, weighted_hours, factor]
      properties:
        student_id:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [none, pending, approved, rejected]
        hours:
          oneOf:
            - $ref: '#/components/schemas/Hours'
            - type: 'null'
        effective_from_week:
          type: [integer, 'null']
        weighted_hours:
          type: number
        factor:
          type: number
          description: The factor in force this week.

    LogEntry:
      type: object
      required: [id, actor_id, actor_name, action, student_id, student_name, week_id, week_number, old_values, new_values, at, flagged, reversible]
      properties:
        id:
          type: string
        actor_id:
          type: string
        actor_name:
          type: string
        action:
          type: string
          enum: [baseline_submitted, baseline_approved, baseline_rejected, weekly_update, weekly_reset, weekly_reversed, settings_changed]
        student_id:
          type: [string, 'null']
        student_name:
          type: [string, 'null']
        week_id:
          type: [string, 'null']
        week_number:
          type: [integer, 'null']
        old_values:
          type: [object, 'null']
        new_values:
          type: [object, 'null']
        at:
          type: string
          format: date-time
        flagged:
          type: boolean
          description: A weekly entry that differs from the baseline by more than the threshold.
        reversible:
          type: boolean
          description: A weekly entry that can still be reversed with `reverseWeeklyUpdate`.

    Explainer:
      type: object
      description: The formula and current parameters, with worked examples. It holds no personal data.
      required: [formula, types, type_weights, rate, cap, limits, factor_table, examples, rules]
      properties:
        formula:
          type: array
          items:
            type: string
        types:
          type: array
          items:
            $ref: '#/components/schemas/CommitmentType'
        type_weights:
          $ref: '#/components/schemas/Weights'
        rate:
          type: number
        cap:
          type: number
        limits:
          $ref: '#/components/schemas/HourLimits'
        factor_table:
          type: array
          items:
            type: object
            required: [weighted_hours, factor]
            properties:
              weighted_hours:
                type: number
              factor:
                type: number
        examples:
          type: array
          items:
            type: object
            required: [title, raw_score, hours, weighted_hours, factor, adjusted_score, capped, steps]
            properties:
              title:
                type: string
              raw_score:
                type: number
              hours:
                $ref: '#/components/schemas/Hours'
              weighted_hours:
                type: number
              factor:
                type: number
              adjusted_score:
                type: number
              capped:
                type: boolean
              steps:
                type: array
                items:
                  type: string
        rules:
          type: array
          items:
            type: string
