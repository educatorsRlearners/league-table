# Override used only by the integration tests (backend/tests/test_integration_docker.py).
# It remaps host ports so the test stack never collides with a stack you already
# have running via plain `docker compose up`; the two run as separate projects
# (-p league_table_it) with separate volumes, so neither can clobber the other.
# The ports are marked `!override` because Compose appends `ports` lists when
# merging files; without it the base 8000/5433 would stay published too and
# collide with a running dev stack.
services:
  db:
    ports: !override
      - "15433:5432"
  backend:
    ports: !override
      - "18000:8000"
      - "8000:8000"
