[project]
name = "league-table-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # Starlette's own test client uses a deprecated anyio alias; nothing to fix on our side.
    # Remove once Starlette releases a version that no longer does.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# B008 is FastAPI's canonical Depends-in-defaults idiom; BLE/S flag the
# intentional broad guards around the toy data source; PIE810 is noise.
# E501 is left to `ruff format` instead of the linter.
select = ["E4", "E7", "E9", "F", "UP", "I", "RUF"]
ignore = ["B008", "BLE", "S", "PIE810", "E501"]

[tool.mypy]
python_version = "3.13"
show_error_codes = true
# Third-party stubs are not all installed; only our code is checked.
ignore_missing_imports = true
